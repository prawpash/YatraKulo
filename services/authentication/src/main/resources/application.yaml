server:
  port: ${APP_PORT:5000}

logging:
  level:
    org.springframework.security: trace

app:
  rsa:
    keyId: ${RSA_KEY_ID}
    publicKey: ${RSA_PUBLIC_KEY}
    privateKey: ${RSA_PRIVATE_KEY}

spring:
  application:
    name: Authentication Service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "oidc-client"
              client-secret: "$2a$12$.OOL0buoBMJTyxYNxE2pFeCIzt4eOf.OitOsgxInQ5.lli6ZnTThi" # password
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1:8765/callback"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/"
              scopes:
                - "openid"
            require-authorization-consent: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

scalar:
  authentication:
    preferredSecurityScheme: OAuth2
    oauth2:
      OAuth2:
        flows:
          authorizationCode:
            clientId: oidc-client
            clientSecret: password
            authorizationUrl: http://localhost:5000/oauth2/authorize
            tokenUrl: http://localhost:5000/oauth2/token
            pkce: sha256
            selectedScopes:
              - openid